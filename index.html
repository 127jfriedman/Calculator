<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
  <link rel = "stylesheet" href = "style.css">
  <script src="index.js"></script>
</head>
<body onload = "ss();">
<div id = "tops">
    <input type = "text" id = "textbox1">
    <input type = "text" id = "textbox2">
</div>
<div id = "buttons">
<div class = "button">
  <p onclick = "input1();">1</p>
</div>
  <div class = "button">
    <p onclick = "input2();">2</p>
  </div>
  <div class = "button">
    <p onclick = "input3();">3</p>
  </div>
  <div class = "button">
    <p onclick = "inputplus();">+</p>
  </div>
  <div class = "button">
    <p onclick = "inputmod();">%</p>
  </div>
  <div class = "button">
    <p onclick = "historyup();">↑</p>
  </div>
  <div class = "button">
    <p onclick = "input4();">4</p>
  </div>
  <div class = "button">
    <p onclick = "input5();">5</p>
  </div>
  <div class = "button">
    <p onclick = "input6();">6</p>
  </div>
  <div class = "button">
    <p onclick = "inputminus();">-</p>
  </div>
  <div class = "button">
    <p onclick = "inputopen();">(</p>
  </div>
  <div class = "button">
    <p onclick = "historydown();">↓</p>
  </div>
  <div class = "button">
    <p onclick = "input7();">7</p>
  </div>
  <div class = "button">
    <p onclick = "input8();">8</p>
  </div>
  <div class = "button">
    <p onclick = "input9();">9</p>
  </div>
  <div class = "button">
    <p onclick = "inputmult();">*</p>
  </div>
  <div class = "button">
    <p onclick = "inputclose();">)</p>
  </div>
  <div class = "button"></div>
  <div class = "button">
    <p onclick = "inputdecimal();">.</p>
  </div>
  <div class = "button">
    <p onclick = "input0();">0</p>
  </div>
  <div class = "button">
    <p onclick = "equals();">=</p>
  </div>
  <div class = "button">
    <p onclick = "inputdivide();">/</p>
  </div>
  <div class = "button">
    <p onclick = "inputsquare();">^</p>
  </div>
  <div class = "button"></div>
</div>
</body>
</html>
